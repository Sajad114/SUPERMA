<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <title>إدارة الطلبات</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- روابط المكتبات -->
  <link rel="stylesheet" href="https://cdn.datatables.net/1.10.24/css/jquery.dataTables.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    body {
      font-family: 'Arial', sans-serif;
      direction: rtl;
      background: #f3f3f3;
      margin: 0;
      padding: 20px;
      color: #333;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      background: #ffffffcc;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
      padding: 30px;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    #filters {
      text-align: center;
      margin-bottom: 20px;
    }

    #filters select {
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    .action-btns {
      display: flex;
      justify-content: center;
      gap: 8px;
    }

    .action-btns button {
      border: none;
      padding: 6px 10px;
      border-radius: 5px;
      color: white;
      cursor: pointer;
    }

    .view-btn { background: #28a745; }
    .delete-btn { background: #dc3545; }
    .share-btn { background: #007bff; }

    #loading {
      text-align: center;
      padding: 10px;
    }

    /* المودال */
    .modal {
      display: none;
      position: fixed;
      z-index: 99;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: rgba(0,0,0,0.4);
      padding-top: 60px;
    }

    .modal-content {
      background-color: #fff;
      margin: 5% auto;
      padding: 20px;
      border-radius: 12px;
      width: 80%;
      position: relative;
      box-shadow: 0 0 10px rgba(0,0,0,0.25);
    }

    .close {
      position: absolute;
      top: 10px;
      left: 20px;
      font-size: 28px;
      cursor: pointer;
    }

    #orderDetails p {
      margin: 8px 0;
      font-size: 15px;
    }

    .btn {
      padding: 8px 12px;
      background: #17a2b8;
      color: #fff;
      text-decoration: none;
      border-radius: 5px;
      display: inline-block;
      margin-top: 10px;
    }

    #newPrice {
      width: 100%;
      padding: 8px;
      margin-top: 10px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>إدارة الطلبات</h2>

  <div id="filters">
    <label>تصفية حسب المحافظة:
      <select id="provinceFilter">
        <option value="">الكل</option>
        <option value="بغداد">بغداد</option>
        <option value="البصرة">البصرة</option>
        <option value="نينوى">نينوى</option>
        <option value="كربلاء">كربلاء</option>
        <!-- أضف المزيد حسب الحاجة -->
      </select>
    </label>
  </div>

  <div id="loading">جاري تحميل الطلبات...</div>

  <table id="ordersTable" class="display">
    <thead>
      <tr>
        <th>اسم العميل</th>
        <th>الهاتف</th>
        <th>العنوان</th>
        <th>المحافظة</th>
        <th>الإجراءات</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<!-- المودال -->
<div id="orderModal" class="modal">
  <div class="modal-content">
    <span class="close">&times;</span>
    <div id="orderDetails"></div>
    <input type="text" id="newPrice" placeholder="أدخل السعر الجديد" />
    <button id="updatePriceBtn" class="btn">تحديث السعر</button>
    <a id="googleMapsLink" class="btn" href="#" target="_blank" style="display:none;">عرض على خرائط Google</a>
  </div>
</div>

<!-- مكتبات JS -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.datatables.net/1.10.24/js/jquery.dataTables.min.js"></script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-app.js";
  import { getDatabase, ref, get, remove, update } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-database.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCJdOJaUzJGTdsa67FqHPnALs6QnNlnk2g",
    authDomain: "talbatsm.firebaseapp.com",
    databaseURL: "https://talbatsm-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "talbatsm",
    storageBucket: "talbatsm.appspot.com",
    messagingSenderId: "300265699609",
    appId: "1:300265699609:web:b8febb73507c57b356ed88"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const auth = getAuth(app);

  const table = $('#ordersTable').DataTable();

  function loadOrders() {
    $('#loading').show();

    get(ref(db, 'reservations')).then(snapshot => {
      const data = snapshot.val();
      if (!data) return $('#loading').text("لا توجد طلبات حالياً");

      table.clear();
      for (const id in data) {
        const o = data[id];
        table.row.add([
          o.customerName,
          o.phoneNumber,
          o.address,
          o.province,
          `
          <div class="action-btns">
            <button class="view-btn" data-id="${id}"><i class="fas fa-eye"></i></button>
            <button class="delete-btn" data-id="${id}"><i class="fas fa-trash-alt"></i></button>
            <button class="share-btn" data-id="${id}"><i class="fas fa-share-alt"></i></button>
          </div>
          `
        ]);
      }

      table.draw();
      $('#loading').hide();
      setActions(data);
    });
  }

  function setActions(data) {
    $('.view-btn').on('click', function () {
      const id = $(this).data('id');
      const o = data[id];

      $('#orderDetails').html(`
        <p><strong>اسم العميل:</strong> ${o.customerName}</p>
        <p><strong>الهاتف:</strong> ${o.phoneNumber}</p>
        <p><strong>العنوان:</strong> ${o.address}</p>
        <p><strong>المحافظة:</strong> ${o.province}</p>
        <p><strong>النوع:</strong> ${o.productType}</p>
        <p><strong>الحجم:</strong> ${o.productSize}</p>
        <p><strong>العدد:</strong> ${o.quantity}</p>
        <p><strong>ملاحظات:</strong> ${o.note || '-'}</p>
        <p><strong>السعر:</strong> <span id="orderPrice">${o.price || 'غير محدد'}</span> دينار</p>
        <p><strong>التاريخ:</strong> ${o.orderDate || 'غير متوفر'}</p>
      `);

      if (o.lat && o.lng) {
        $('#googleMapsLink').attr('href', `https://www.google.com/maps/search/?api=1&query=${o.lat},${o.lng}`).show();
      } else {
        $('#googleMapsLink').hide();
      }

      $('#orderModal').show();

      $('#updatePriceBtn').off().on('click', () => {
        const newPrice = $('#newPrice').val().trim();
        if (!newPrice) return Swal.fire('تنبيه', 'يرجى إدخال السعر الجديد', 'warning');

        update(ref(db, 'reservations/' + id), { price: newPrice }).then(() => {
          $('#orderPrice').text(newPrice);
          Swal.fire('تم التحديث', 'تم تحديث السعر بنجاح', 'success');
        });
      });

      $('.close').on('click', () => $('#orderModal').hide());
      window.onclick = e => { if (e.target == document.getElementById("orderModal")) $('#orderModal').hide(); };
    });

    $('.delete-btn').on('click', function () {
      const id = $(this).data('id');
      Swal.fire({
        title: 'هل أنت متأكد؟',
        text: "سيتم حذف الطلب نهائياً!",
        icon: 'warning',
        showCancelButton: true,
        confirmButtonText: 'نعم',
        cancelButtonText: 'إلغاء'
      }).then(result => {
        if (result.isConfirmed) {
          remove(ref(db, 'reservations/' + id)).then(() => {
            Swal.fire('تم الحذف', '', 'success');
            loadOrders();
          });
        }
      });
    });

    $('.share-btn').on('click', function () {
      const id = $(this).data('id');
      const link = `${window.location.origin}/SUPERMA/order-details.html?id=${id}`;
      if (navigator.share) {
        navigator.share({ title: "تفاصيل الطلب", url: link });
      } else {
        Swal.fire("رابط المشاركة", `<input value="${link}" readonly style="width:100%;padding:10px;">`, "info");
      }
    });
  }

  $(document).ready(() => {
    onAuthStateChanged(auth, user => {
      if (user) loadOrders();
      else window.location.href = "login.html";
    });

    $('#provinceFilter').on('change', function () {
      table.column(3).search(this.value).draw();
    });
  });
</script>
</body>
</html>
